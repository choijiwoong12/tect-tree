services:
  db:
    image: mysql:8.0-oracle
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: athena
      MYSQL_USER: athena
      MYSQL_PASSWORD: athena
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uathena", "-pathena"]
      interval: 5s
      timeout: 3s
      retries: 20

  back:
    build: ./back
    restart: unless-stopped
    env_file:
      - ./back/.env
    environment:
      DATABASE_URL: mysql+pymysql://athena:athena@db:3306/athena
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  front:
    build: ./front
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - back

volumes:
  db_data:
