services:
  admin:
    build:
      context: .
    environment:
      APP_NAME: ${APP_NAME:-Admin}
      APP_ENV: local
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8001/auth/google/callback}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-change-me-for-local-dev}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
      DATAHUB_DATABASE_FILE: ${DATAHUB_DATABASE_FILE:-/datahub/datahub.db}
      DATAHUB_UPLOAD_DIR: ${DATAHUB_UPLOAD_DIR:-/datahub/uploads}
    ports:
      - "${PORT:-8001}:8000"
    volumes:
      - .:/app
      - ../datahub:/datahub
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
